draw-service.base-url=http://localhost:8084

logging.level.org.springframework.security=DEBUG


spring.kafka.bootstrap-servers=127.0.0.1:9092
audit.kafka.topic=audit-events

# Fail within seconds when Kafka is unreachable, so the publisher retries soon
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
